<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script type="text/javascript">
      var path = window.location.pathname;
      var search = window.location.search || "";
      var hash = "#"+path.replace("/redseam-clothing", "") + window.location.hash;
      window.location.replace("/redseam-clothing/" + search + hash);
    </script>
  </head>
  <body></body>
</html>
